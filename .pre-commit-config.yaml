repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: Pyright
        entry: uv run pyright
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest (affected tests)
        entry: uv run pytest --testmon -q
        language: system
        pass_filenames: false
